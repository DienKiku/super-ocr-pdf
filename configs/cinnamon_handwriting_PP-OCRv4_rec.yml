Global:
  model_name: PP-OCRv4_mobile_rec
  debug: false
  use_gpu: false
  epoch_num: 3
  log_smooth_window: 10
  print_batch_step: 10
  save_model_dir: ./output/rec_cinnamon_v4
  save_epoch_step: 1
  eval_batch_step: [0, 50]
  cal_metric_during_train: true
  pretrained_model: ../pretrained/ch_PP-OCRv4_rec_train/student
  checkpoints:
  save_inference_dir: ./output/rec_cinnamon_v4_infer
  use_visualdl: false
  infer_img: ../cinnamon_dataset/vn_handwritten_images/data/0000_samples.png
  character_dict_path: ../train_data_cinnamon/viet_dict.txt
  max_text_length: &max_text_length 70
  infer_mode: false
  use_space_char: true
  distributed: false
  save_res_path: ./output/rec/predicts_cinnamon_v4.txt
  d2s_train_image_shape: [3, 48, 640]

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0005
    warmup_epoch: 1
  regularizer:
    name: L2
    factor: 3.0e-05

Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform:
  Backbone:
    name: PPLCNetV3
    scale: 0.95
  Head:
    name: MultiHead
    head_list:
      - CTCHead:
          Neck:
            name: svtr
            dims: 120
            depth: 2
            hidden_dims: 120
            kernel_size: [1, 3]
            use_guide: True
          Head:
            fc_decay: 0.00001
      - NRTRHead:
          nrtr_dim: 384
          max_text_length: *max_text_length

Loss:
  name: MultiLoss
  loss_config_list:
    - CTCLoss:
    - NRTRLoss:

PostProcess:  
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: SimpleDataSet
    data_dir: ../cinnamon_dataset/vn_handwritten_images/data/
    label_file_list:
    - ../train_data_cinnamon/train_sub.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - RecAug:
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - RecResizeImg:
        image_shape: [3, 48, 640]
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  loader:
    shuffle: true
    batch_size_per_card: 16
    drop_last: false
    num_workers: 0

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ../cinnamon_dataset/vn_handwritten_images/data/
    label_file_list:
    - ../train_data_cinnamon/val_sub.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - RecResizeImg:
        image_shape: [3, 48, 640]
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 16
    num_workers: 0
